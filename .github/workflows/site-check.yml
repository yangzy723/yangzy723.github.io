name: Site check

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --destination _site

      - name: Validate generated data
        run: |
          ruby -rjson -e 'data = JSON.parse(File.read("_site/static/search-index.json")); abort "invalid search index" unless data.is_a?(Array) && data.all? { |entry| %w[title url date category content].all? { |key| entry[key].is_a?(String) } }'
          ruby -rrexml/document -e 'ARGV.each { |path| REXML::Document.new(File.read(path)) }' _site/static/xml/rss.xml _site/static/xml/sitemap.xml
