<footer class="footer">
  <div class="footer-meta">
    <span>© {{ site.time | date: "%Y" }} {{ site.author_en }}</span>
    <span class="footer-note">Notes on research, systems, and engineering.</span>
  </div>
  <nav class="footer-links" aria-label="{% if page.lang == "en" %}Site and profile links{% else %}站点与个人资料链接{% endif %}">
    <a href="{{ site.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="{{ site.orcid }}" target="_blank" rel="noopener noreferrer">ORCID</a>
    <a href="{{ '/static/xml/rss.xml' | relative_url }}">RSS</a>
  </nav>
  <button class="to-top" type="button" aria-label="{% if page.lang == "en" %}Back to top{% else %}返回顶部{% endif %}" hidden>
    <i class="svg-icon icon-arrow-top" aria-hidden="true"></i>
  </button>
</footer>
