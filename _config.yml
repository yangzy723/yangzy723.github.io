encoding: utf-8

# SEO相关信息
title: Zhenyuan Yang
description: Personal website of Zhenyuan Yang
keywords: AI systems, performance engineering, research notes
author: 杨镇源

# 这些不要动
permalink: /posts/:year/:month/:day/:title.html
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge
exclude: ['README.md', '_site', 'dist', 'Gemfile', 'Gemfile.lock', 'blog.sh', 'archive']

# 域名配置
# baseurl配置,如果网站部署在根目录下的其他目录中，请设置为 /目录名
domainUrl: 'https://yangzy723.github.io'
baseurl: ''

# 吐个槽地址，会在chat页面中重定向到该地址
# tucaoUrl: https://support.qq.com/product/86335

# 菜单
# 必填字段 title: '文本' url: '链接'
# 可选字段 target: '_blank' 新页面打开 
menu:
  - title: Home
    url: /
  - title: Categories
    url: /pages/categories.html
  - title: About
    url: /pages/about.html

# 数学公式支持，默认关闭，需要时在文章 front matter 中按需开启
extMath: false

